# Repository settings for @types/lawforge__courtlistener
# Managed by Probot Settings (https://probot.github.io/apps/settings/)

repository:
  # Repository metadata
  name: lawforge-courtlistener-types
  description: TypeScript type definitions for CourtListener API
  homepage: https://github.com/drengskapur/lawforge-courtlistener-types
  topics: typescript, types, courtlistener, legal, api, definitions

  # Repository features
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: true
  has_discussions: false

  # Visibility and access
  private: false
  allow_merge_commit: true
  allow_squash_merge: true
  allow_rebase_merge: true
  delete_branch_on_merge: true

  # Default branch
  default_branch: main

  # Repository settings
  allow_update_branch: true
  allow_auto_merge: true
  squash_merge_commit_title: "PR_TITLE"
  squash_merge_commit_message: "COMMIT_MESSAGES"

# Branch protection rules
branches:
  - name: main
    protection:
      required_status_checks:
        required_check: ci
        contexts:
          - test (18.x)
          - test (20.x)
          - lint
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        dismissal_restrictions: {}
      restrictions: null
      enforce_admins: false
      allow_force_pushes: false
      allow_deletions: false
      block_creations: false

# Repository labels
labels:
  - name: dependencies
    color: 0366d6
    description: Pull requests that update a dependency file

  - name: javascript
    color: f1e05a
    description: Pull requests that update Javascript code

  - name: typescript
    color: 2b7489
    description: Pull requests that update TypeScript code

  - name: github-actions
    color: 000000
    description: Pull requests that update GitHub Actions code

  - name: renovate
    color: 1a1a1a
    description: Automated dependency updates by Renovate

  - name: major
    color: b60205
    description: Major version updates that may introduce breaking changes

  - name: minor
    color: fbca04
    description: Minor version updates with new features

  - name: patch
    color: 0e8a16
    description: Patch updates for bug fixes

  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation

  - name: enhancement
    color: a2eeef
    description: New feature or request

  - name: bug
    color: d73a49
    description: Something isn't working

  - name: question
    color: d876e3
    description: Further information is requested

  - name: wontfix
    color: ffffff
    description: This will not be worked on

  - name: duplicate
    color: cfd3d7
    description: This issue or pull request already exists
