# Repository settings for lawforge-courtlistener-types
# Managed by Probot Settings (https://probot.github.io/apps/settings/)
# Optimized for single maintainer workflow

repository:
  name: lawforge-courtlistener-types
  description: TypeScript type definitions for CourtListener API
  homepage: https://lawforge-courtlistener-types.readthedocs.io
  topics: typescript, types, courtlistener, legal, api, definitions

  # Minimal features for a types package
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: true
  has_discussions: false

  # Single maintainer: direct push workflow
  private: false
  allow_merge_commit: false      # Disable for cleaner history
  allow_squash_merge: true       # Preferred: clean single commits
  allow_rebase_merge: false      # Disable for simplicity
  delete_branch_on_merge: true   # Auto-cleanup

  default_branch: main

  # Auto-merge for bot PRs (Dependabot, Renovate)
  allow_update_branch: true
  allow_auto_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES

# Branch protection: CI must pass, but no reviews required (single maintainer)
branches:
  - name: main
    protection:
      required_status_checks:
        strict: true              # Branch must be up to date
        contexts:
          - ci                    # CI workflow must pass
      required_pull_request_reviews: null  # No reviews (single maintainer)
      restrictions: null
      enforce_admins: false       # Admin can bypass
      required_linear_history: true  # Clean git history
      allow_force_pushes: false
      allow_deletions: false

# Essential labels only
labels:
  - name: dependencies
    color: "0366d6"
    description: Dependency updates

  - name: bug
    color: "d73a49"
    description: Something isn't working

  - name: enhancement
    color: "a2eeef"
    description: New feature or improvement

  - name: documentation
    color: "0075ca"
    description: Documentation updates

  - name: security
    color: "ee0701"
    description: Security-related changes

  - name: breaking
    color: "b60205"
    description: Breaking changes
